  services:
    zookeeper:
      image: confluentinc/cp-zookeeper:7.6.0
      container_name: news_zookeeper
      restart: "no"
      environment: 
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      networks: 
        - lakehouse

    kafka:
      image: confluentinc/cp-kafka:7.6.0
      container_name: news_kafka
      restart: "no"
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      networks:
        - lakehouse

    minio:
      image: minio/minio:latest
      container_name: news_minio
      restart: "no"
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        MINIO_ROOT_USER: admin
        MINIO_ROOT_PASSWORD: password
      command: server /data --console-address ":9001"
      volumes:
        - minio_data:/data
      networks:
        - lakehouse
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
        interval: 10s
        timeout: 5s
        retries: 5

    create-bucket: 
      image: minio/mc
      container_name: news_create-bucket
      depends_on: 
        minio:
          condition : service_healthy
      entrypoint: >
        /bin/sh -c "
        sleep 3;
        mc alias set myminio http://minio:9000 admin password;
        mc mb myminio/warehouse --ignore-existing;
        mc anonymous set public myminio/warehouse;
        exit 0;
        "
      networks:
        - lakehouse

    iceberg-rest:
      image: tabulario/iceberg-rest:latest
      container_name: news_iceberg-rest
      restart: "no"
      ports:
        - "8181:8181"
      environment:
        AWS_ACCESS_KEY_ID: admin
        AWS_SECRET_ACCESS_KEY: password
        AWS_REGION: us-east-1
        CATALOG_WAREHOUSE: s3://warehouse/
        CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
        CATALOG_S3_ENDPOINT: http://minio:9000
        CATALOG_S3_PATH__STYLE__ACCESS: "true"
        CATALOG_S3_ACCESS__KEY__ID: admin
        CATALOG_S3_SECRET__ACCESS__KEY: password
        CATALOG_S3_REGION: us-east-1
      depends_on:
        - create-bucket
      networks:
        - lakehouse

  networks:
    lakehouse:
      driver: bridge

  volumes:
    minio_data: